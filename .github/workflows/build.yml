name: build

on:
  push:
    branches: [main, "feature/**", "release/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxdo-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev pkg-config
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Upload Linux preview binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-clicker-linux-x86_64
          path: target/release/keyboard-clicker
          retention-days: 14
      - name: Upload Windows preview executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-clicker-windows-x86_64
          path: target/release/keyboard-clicker.exe
          retention-days: 14

  release:
    name: Package release (${{ matrix.target }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: keyboard-clicker-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: keyboard-clicker-windows-x86_64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libxdo-dev libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev pkg-config
      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf ${{ matrix.asset }} -C target/${{ matrix.target }}/release keyboard-clicker
      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/keyboard-clicker.exe -DestinationPath ${{ matrix.asset }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Keyboard Clicker ${{ github.ref_name }}
          files: keyboard-clicker-*
          body_path: .github/release-notes/${{ github.ref_name }}.md
          draft: false
          prerelease: false
          make_latest: true
