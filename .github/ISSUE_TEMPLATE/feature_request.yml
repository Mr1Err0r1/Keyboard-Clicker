name: Feature request
description: Suggest an improvement or new capability.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Explain the user problem first; implementation ideas are welcome but optional.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do that is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
