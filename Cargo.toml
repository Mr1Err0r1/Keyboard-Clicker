[package]
name = "keyboard-clicker"
version = "2.0.0"
edition = "2021"
description = "Cross-platform mouse and keyboard automation"
license = "MIT"

[lib]
name = "keyboard_clicker"
path = "src/lib.rs"

[[bin]]
name = "keyboard-clicker"
path = "src/main.rs"

[dependencies]
eframe = "0.22.0"
enigo = "0.1.3"
global-hotkey = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "7.0"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["winuser", "windef"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
